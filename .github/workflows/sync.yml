name: Sync Notion -> iCloud

on:
  schedule:
        - cron: "17 5 * * 1" # lundi ~05:17 UTC (~6-7h Paris) — décalé de l'heure pile pour éviter les délais/sauts liés à la forte charge GitHub à :00
  workflow_dispatch: {} # permet un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python sync_to_icloud.py
        env:
          NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}
          ICLOUD_APPLE_ID: ${{ secrets.ICLOUD_APPLE_ID }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}

      - name: Commit et push la page de suivi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet --cached || git commit -m "Sync séances Notion"
          git push
