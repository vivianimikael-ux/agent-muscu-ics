name: Sync Notion -> ICS

on:
  schedule:
    - cron: "0 5 * * 1" # lundi ~05:00 UTC (~6-7h Paris selon heure d'été)
  workflow_dispatch: {} # permet un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python sync_to_ics.py
        env:
          NOTION_TOKEN_V2: ${{ secrets.NOTION_TOKEN_V2 }}

      - name: Commit et push le .ics mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/musculation.ics
          git diff --quiet --cached || git commit -m "Sync séances Notion"
          git push
